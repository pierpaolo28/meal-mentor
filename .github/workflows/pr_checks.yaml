# PR gate: lint, unit tests, integration tests, offline eval.
# Runs on every pull request; only deploys after merge to main via staging.yaml.

name: PR Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'deployment/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Install lint deps
        run: uv sync --locked --extra lint
      - name: Ruff (lint)
        run: uv run ruff check app tests
      - name: Ruff (format check)
        run: uv run ruff format --check app tests
      - name: Codespell
        run: uv run codespell app tests README.md AGENTS.md

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Install deps
        run: uv sync --locked
      - name: Unit tests (in-memory store, no GCP)
        env:
          USE_IN_MEMORY_STORE: '1'
        run: uv run pytest tests/unit -v

  integration-and-eval:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Install deps
        run: uv sync --locked --extra eval

      - name: Integration tests
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ vars.CICD_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          USE_IN_MEMORY_STORE: '1'
        run: uv run pytest tests/integration -v

      - name: Agent eval (generate + grade against golden dataset)
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ vars.CICD_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          USE_IN_MEMORY_STORE: '1'
        run: |
          uv run agents-cli eval generate \
            --dataset tests/eval/datasets/basic-dataset.json \
            --output-dir .eval-out
          uv run agents-cli eval grade \
            --generated .eval-out \
            --config tests/eval/eval_config.yaml \
            --output-dir .eval-out
